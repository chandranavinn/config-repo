apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "deployboard.fullname" . }}-database
  labels:
    {{- include "deployboard.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.database.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.database.secretStore.name }}
    kind: {{ .Values.database.secretStore.kind }}
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        url: {{ printf "postgresql+psycopg://{{ .username | urlquery }}:{{ .password | urlquery }}@%s:%v/%s?sslmode=require" (required "database.host is required" .Values.database.host) .Values.database.port .Values.database.name | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "database.remoteSecretKey is required" .Values.database.remoteSecretKey | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.remoteSecretKey | quote }}
        property: password
