{{- range $component := list "backend" "frontend" }}
{{- $config := index $.Values $component }}
{{- if $config.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "app-cluster1-deploy.fullname" $ }}-{{ $component }}
  labels:
    app.kubernetes.io/component: {{ $component }}
    {{- include "app-cluster1-deploy.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "app-cluster1-deploy.fullname" $ }}-{{ $component }}
  minReplicas: {{ $config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- end }}
