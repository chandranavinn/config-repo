apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-cluster1-deploy.fullname" . }}-frontend
  labels:
    app.kubernetes.io/component: frontend
    {{- include "app-cluster1-deploy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      {{- include "app-cluster1-deploy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        {{- include "app-cluster1-deploy.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
          env:
            - name: BACKEND_HOST
              value: {{ printf "%s-backend" (include "app-cluster1-deploy.fullname" .) | quote }}
            - name: BACKEND_PORT
              value: {{ .Values.backend.servicePort | quote }}
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
