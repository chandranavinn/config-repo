apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-cluster1-deploy.fullname" . }}-frontend
  labels:
    {{- include "app-cluster1-deploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.servicePort }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "app-cluster1-deploy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
